name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'cmd/**'
      - 'internal/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build kb
        run: go build -o "${RUNNER_TEMP}/kb" ./cmd/kb
      - name: Check and build documentation
        run: |
          "${RUNNER_TEMP}/kb" --workspace site check
          "${RUNNER_TEMP}/kb" --workspace site build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.kb/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
